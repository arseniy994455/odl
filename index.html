<title>My Demon List</title>

<style>
:root{
  --blue:#18aee8;
  --blue2:#087cc2;
  --light:#eefaff;
  --white:#fff;
  --text:#12324a;
  --muted:#6a8799;
  --border:#d9f2fc;
  --shadow:0 10px 30px rgba(8,124,194,.14);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,Arial,sans-serif;
  background:linear-gradient(135deg,#e9faff,#fff);
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1100px;
  margin:auto;
  padding:18px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:900;
  color:var(--blue2);
}

.logo span{
  color:var(--text);
}

button{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:var(--blue);
  color:white;
  box-shadow:0 6px 18px rgba(24,174,232,.25);
}

.secondary{
  background:#e8f7fd;
  color:var(--blue2);
}

  margin:45px auto 25px;
  padding:0 22px;
}
