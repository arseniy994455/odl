<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Demon List</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --blue:#18aee8; --blue2:#087cc2; --light:#eefaff;
  --text:#12324a; --muted:#6a8799; --border:#d9f2fc;
  --danger:#ef5350; --shadow:0 10px 30px #087cc21a;
}
* { box-sizing:border-box }
body {
  margin:0; font-family:Arial,Helvetica,sans-serif;
  color:var(--text); background:linear-gradient(#eefaff,#fff 55%);
}
button,input { font:inherit }
button { cursor:pointer }
.header {
  height:72px; background:#ffffffed; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 5%; position:sticky; top:0; z-index:10;
}
.logo { font-size:23px; font-weight:900; color:var(--blue2) }
.container { width:min(1050px,92%); margin:auto }
.hero { text-align:center; padding:48px 10px 30px }
.hero h1 { margin:0; font-size:clamp(36px,7vw,62px); color:var(--blue2) }
.hero p { color:var(--muted) }
.top-actions { text-align:center; margin-bottom:24px }
.levels { display:flex; flex-direction:column; gap:12px; padding-bottom:55px }
.level {
  display:grid; grid-template-columns:86px minmax(0,1fr) auto;
  align-items:center; gap:16px; padding:12px;
  background:white; border:1px solid var(--border); border-radius:17px;
  box-shadow:var(--shadow);
}
.rank {
  width:80px; height:76px; border-radius:13px;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; color:white; font-size:26px; font-weight:900;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
}
.rank img { width:100%; height:100%; object-fit:cover }
.level-name { font-size:21px; font-weight:800; overflow-wrap:anywhere }
.level-author { margin-top:5px; font-size:14px; color:var(--muted) }
.level-score { margin-top:7px; font-size:14px; color:var(--blue2); font-weight:700 }
.actions { display:none; gap:7px; flex-wrap:wrap; justify-content:flex-end }
.admin-mode .actions { display:flex }
.btn { border:0; border-radius:10px; padding:10px 14px; font-weight:700 }
.primary { color:white; background:linear-gradient(135deg,var(--blue),var(--blue2)) }
.light { color:var(--blue2); background:var(--light); border:1px solid var(--border) }
.danger { color:var(--danger); background:#fff0f0; border:1px solid #ffd2d2 }
.empty,.loading {
  text-align:center; padding:35px 18px; color:var(--muted);
  background:white; border:1px solid var(--border); border-radius:16px;
}
.modal-bg {
  display:none; position:fixed; inset:0; z-index:50;
  background:#07283c77; align-items:center; justify-content:center; padding:18px;
}
.modal-bg.show { display:flex }
.modal {
  background:white; border-radius:19px; padding:24px;
  width:min(470px,100%); max-height:90vh; overflow:auto;
}
.modal h2 { margin:0 0 20px; color:var(--blue2) }
.field { margin-bottom:14px }
.field label { display:block; font-size:13px; font-weight:700; margin-bottom:7px }
.field input {
  width:100%; border:1px solid var(--border); border-radius:10px;
  padding:12px; outline:none; background:#fbfeff; color:var(--text);
}
.field input:focus { border-color:var(--blue) }
.hint { color:var(--muted); font-size:12px; margin-top:5px }
.upload-box { padding:14px; background:#f8fdff; border:2px dashed var(--border); border-radius:13px }
.preview { display:none; margin-top:12px }
.preview img { width:100%; max-height:200px; object-fit:cover; border-radius:10px }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px }
.status { font-size:13px; color:var(--muted); margin-top:8px; overflow-wrap:anywhere }
.toast {
  position:fixed; z-index:100; bottom:20px; left:50%;
  transform:translate(-50%,20px); opacity:0; pointer-events:none;
  background:#12324a; color:white; padding:12px 18px; border-radius:12px;
  transition:.2s; max-width:90%; text-align:center;
}
.toast.show { opacity:1; transform:translate(-50%,0) }
@media(max-width:650px) {
  .header { padding:0 4% }
  .logo { font-size:19px }
  .level { grid-template-columns:65px minmax(0,1fr); gap:11px }
  .rank { width:62px; height:62px; font-size:21px }
  .level-name { font-size:18px }
  .actions { grid-column:1/-1 }
}
</style>
</head>

<body>
<header class="header">
  <div class="logo">My Demon List</div>
  <div>
    <button class="btn light" id="loginButton" onclick="openLogin()">Войти</button>
    <button class="btn light" id="logoutButton" onclick="logout()" hidden>Выйти</button>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h1>My Demon List</h1>
    <p>Personal Geometry Dash Demon List</p>
  </section>

  <div class="top-actions">
    <button class="btn primary" id="addButton" onclick="openAddModal()" hidden>
      + Добавить уровень
    </button>
  </div>

  <section id="levels" class="levels">
    <div class="loading">Загрузка уровней...</div>
  </section>
</main>

<!-- ВХОД -->
<div class="modal-bg" id="loginModal">
  <div class="modal">
    <h2>Вход администратора</h2>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" autocomplete="username">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <div class="modal-actions">
      <button class="btn light" onclick="closeModal('loginModal')">Отмена</button>
      <button class="btn primary" id="loginSubmit" onclick="login()">Войти</button>
    </div>
  </div>
</div>

<!-- ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ -->
<div class="modal-bg" id="levelModal">
  <div class="modal">
    <h2 id="levelModalTitle">Добавить уровень</h2>
    <input type="hidden" id="editId">

    <div class="field">
      <label>Название уровня</label>
      <input id="levelName" placeholder="-Sirius-">
    </div>

    <div class="field">
      <label>Автор</label>
      <input id="levelAuthor" placeholder="Имя автора">
    </div>

    <div class="field">
      <label>Rank — позиция в списке</label>
      <input id="levelRank" type="number" min="1" step="1" placeholder="1">
      <div class="hint">Укажи позицию. Остальные уровни автоматически сдвинутся.</div>
    </div>

    <div class="field">
      <label>Score / Attempts</label>
      <input id="levelScore" placeholder="Например: 700 attempts">
    </div>

    <div class="field">
      <label>Обложка уровня</label>
      <div class="upload-box">
        <input type="file" id="coverFile"
          accept="image/png,image/jpeg,image/webp" onchange="previewCover(event)">
        <div class="status" id="uploadStatus">Выбери изображение с устройства</div>
        <div class="preview" id="coverPreview">
          <img id="previewImage" alt="Предпросмотр обложки">
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn light" onclick="closeModal('levelModal')">Отмена</button>
      <button class="btn primary" id="saveButton" onclick="saveLevel()">Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* НАСТРОЙКИ SUPABASE */
const SUPABASE_URL = "https://jlqddwufeosdszoemdom.supabase.co";
const SUPABASE_KEY = "sb_publishable_SlsvVAcxBAbsFVPy8V_xow_0rteDQZa";
const ADMIN_EMAIL = "arsenijkrasnov882@gmail.com";
const BUCKET_NAME = "covers";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let levelsCache = [];
let selectedCoverFile = null;
let selectedCoverUrl = "";
let saving = false;

/* ЗАПУСК */
document.addEventListener("DOMContentLoaded", async () => {
  await updateAuthUI();
  await loadLevels();
});

async function updateAuthUI() {
  const { data: { user } } = await db.auth.getUser();
  currentUser = user;

  const isAdmin = currentUser?.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase();
  document.body.classList.toggle("admin-mode", !!isAdmin);

  document.getElementById("loginButton").hidden = !!isAdmin;
  document.getElementById("logoutButton").hidden = !isAdmin;
  document.getElementById("addButton").hidden = !isAdmin;
}

db.auth.onAuthStateChange(() => {
  setTimeout(async () => {
    await updateAuthUI();
    await loadLevels();
  }, 0);
});

/* АВТОРИЗАЦИЯ */
function openLogin() {
  document.getElementById("loginModal").classList.add("show");
}
function closeModal(id) {
  document.getElementById(id).classList.remove("show");
}

async function login() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const button = document.getElementById("loginSubmit");

  if (!email || !password) return showToast("Введи email и пароль.");

  button.disabled = true;
  button.textContent = "Входим...";

  const { error } = await db.auth.signInWithPassword({ email, password });

  button.disabled = false;
  button.textContent = "Войти";

  if (error) return showToast("Ошибка входа: " + error.message);

  closeModal("loginModal");
  showToast("Вход выполнен.");
  await updateAuthUI();
  await loadLevels();
}

async function logout() {
  const { error } = await db.auth.signOut();
  if (error) return showToast(error.message);
  await updateAuthUI();
  await loadLevels();
  showToast("Вы вышли из аккаунта.");
}

function isAdmin() {
  return !!currentUser?.email &&
    currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
}

/* ЗАГРУЗКА СПИСКА */
async function loadLevels() {
  const container = document.getElementById("levels");
  container.innerHTML = '<div class="loading">Загрузка уровней...</div>';

  const { data, error } = await db
    .from("levels")
    .select("*")
    .order("rank", { ascending: true });

  if (error) {
    console.error(error);
    container.innerHTML = `<div class="empty">Не удалось загрузить уровни.<br><br>${escapeHtml(error.message)}</div>`;
    return;
  }

  levelsCache = data || [];

  // Примеры отображаются, если база пока пустая.
  // Они не записываются в Supabase автоматически.
  if (levelsCache.length === 0) {
    levelsCache = [
      { id: "demo-1", name: "-Sirius-", author: "Unknown", rank: 1, score: "", cover_url: "" },
      { id: "demo-2", name: "revolver", author: "Unknown", rank: 2, score: "", cover_url: "" },
      { id: "demo-3", name: "boobawamba", author: "Unknown", rank: 3, score: "", cover_url: "" }
    ];
  }

  renderLevels();
}

/* ОТОБРАЖЕНИЕ */
function renderLevels() {
  const container = document.getElementById("levels");

  if (!levelsCache.length) {
    container.innerHTML = '<div class="empty">Пока нет уровней.</div>';
    return;
  }

  container.innerHTML = levelsCache.map(level => {
    const rankContent = level.cover_url
      ? `<img src="${escapeHtml(level.cover_url)}" alt="Обложка">`
      : escapeHtml(level.rank);

    const actions = isAdmin() && !String(level.id).startsWith("demo-")
      ? `<div class="actions">
           <button class="btn light" onclick="openEditModal('${escapeJs(level.id)}')">Изменить</button>
           <button class="btn danger" onclick="deleteLevel('${escapeJs(level.id)}')">Удалить</button>
         </div>`
      : "";

    return `
      <article class="level">
        <div class="rank">${rankContent}</div>
        <div class="level-info">
          <div class="level-name">${escapeHtml(level.name || "Unnamed")}</div>
          <div class="level-author">by ${escapeHtml(level.author || "Unknown")}</div>
          ${level.score ? `<div class="level-score">${escapeHtml(level.score)}</div>` : ""}
        </div>
        ${actions}
      </article>`;
  }).join("");
}

/* ФОРМА ДОБАВЛЕНИЯ */
function openAddModal() {
  if (!isAdmin()) return showToast("Нет доступа.");

  document.getElementById("levelModalTitle").textContent = "Добавить уровень";
  document.getElementById("editId").value = "";
  document.getElementById("levelName").value = "";
  document.getElementById("levelAuthor").value = "";
  document.getElementById("levelRank").value = getNextRank();
  document.getElementById("levelScore").value = "";

  selectedCoverFile = null;
  selectedCoverUrl = "";
  resetCoverInput();

  document.getElementById("levelModal").classList.add("show");
}

/* ФОРМА РЕДАКТИРОВАНИЯ */
function openEditModal(id) {
  if (!isAdmin()) return showToast("Нет доступа.");

  const level = levelsCache.find(x => String(x.id) === String(id));
  if (!level) return showToast("Уровень не найден.");

  document.getElementById("levelModalTitle").textContent = "Редактировать уровень";
  document.getElementById("editId").value = level.id;
  document.getElementById("levelName").value = level.name || "";
  document.getElementById("levelAuthor").value = level.author || "";
  document.getElementById("levelRank").value = level.rank || 1;
  document.getElementById("levelScore").value = level.score || "";

  selectedCoverFile = null;
  selectedCoverUrl = level.cover_url || "";
  resetCoverInput();

  if (selectedCoverUrl) {
    document.getElementById("previewImage").src = selectedCoverUrl;
    document.getElementById("coverPreview").style.display = "block";
