<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Demon List</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --blue: #18aee8;
    --blue2: #087cc2;
    --light: #eefaff;
    --white: #ffffff;
    --text: #12324a;
    --muted: #6a8799;
    --border: #d9f2fc;
    --danger: #ef5350;
    --shadow: 0 10px 30px rgba(8,124,194,0.12);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #eefaff 0%, #ffffff 55%);
    color: var(--text);
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.header {
    height: 72px;
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(10px);
}

.logo {
    font-size: 24px;
    font-weight: 800;
    color: var(--blue2);
}

.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.admin-label {
    display: none;
    color: var(--blue2);
    font-size: 13px;
    font-weight: 700;
}

.container {
    width: min(1100px, 92%);
    margin: auto;
}

.hero {
    text-align: center;
    padding: 55px 15px 35px;
}

.hero h1 {
    margin: 0;
    font-size: clamp(36px, 7vw, 64px);
    font-weight: 900;
    color: var(--blue2);
}

.hero p {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 16px;
}

.top-actions {
    display: flex;
    justify-content: center;
    margin-bottom: 25px;
}

.levels {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 60px;
}

.level {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 18px;
    min-height: 100px;
    display: grid;
    grid-template-columns: 95px 1fr auto;
    align-items: center;
    gap: 18px;
    padding: 12px 20px 12px 12px;
    box-shadow: var(--shadow);
    transition: 0.2s ease;
}

.level:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 35px rgba(8,124,194,0.16);
}

.rank {
    width: 80px;
    height: 76px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--blue), var(--blue2));
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    font-weight: 900;
    overflow: hidden;
}

.rank img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.level-info {
    min-width: 0;
}

.level-name {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    word-break: break-word;
}

.level-author {
    margin-top: 5px;
    color: var(--muted);
    font-size: 14px;
}

.level-score {
    margin-top: 7px;
    color: var(--blue2);
    font-size: 14px;
    font-weight: 700;
}

.level-actions {
    display: none;
    gap: 7px;
}

.admin-mode .level-actions {
    display: flex;
}

.btn {
    border: none;
    border-radius: 11px;
    padding: 10px 15px;
    font-weight: 700;
    transition: 0.15s ease;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn-primary {
    background: linear-gradient(135deg, var(--blue), var(--blue2));
    color: white;
}

.btn-light {
    background: var(--light);
    color: var(--blue2);
    border: 1px solid var(--border);
}

.btn-danger {
    background: #fff0f0;
    color: var(--danger);
    border: 1px solid #ffd2d2;
}

.add-button {
    padding: 13px 22px;
    border-radius: 13px;
    font-size: 15px;
}

.empty {
    background: white;
    border: 1px dashed var(--border);
    border-radius: 18px;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
}

.loading {
    text-align: center;
    color: var(--muted);
    padding: 40px;
}

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(7,40,60,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: min(480px, 100%);
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.2);
    max-height: 90vh;
    overflow-y: auto;
}

.modal h2 {
    margin: 0 0 20px;
    color: var(--blue2);
}

.field {
    margin-bottom: 15px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
}

.field input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 12px;
    outline: none;
    color: var(--text);
    background: #fbfeff;
}

.field input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(24,174,232,0.12);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}

.upload-box {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    background: #f8fdff;
}

.upload-box input {
    border: none;
    padding: 5px;
    background: transparent;
}

.preview {
    display: none;
    margin-top: 12px;
}

.preview img {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 12px;
}

.upload-status {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
}

.error {
    color: var(--danger);
}

.success {
    color: #169447;
}

.login-info {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 15px;
}

.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #12324a;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: 0.25s ease;
    z-index: 300;
    max-width: 90%;
    text-align: center;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

@media (max-width: 700px) {
    .header {
        padding: 0 4%;
    }

    .logo {
        font-size: 20px;
    }

    .level {
        grid-template-columns: 70px 1fr;
        gap: 12px;
        padding: 10px;
    }

    .rank {
        width: 65px;
        height: 65px;
        font-size: 21px;
    }

    .level-name {
        font-size: 18px;
    }

    .level-actions {
        grid-column: 1 / -1;
        justify-content: flex-end;
    }

    .admin-label {
        display: none !important;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">My Demon List</div>

    <div class="header-right">
        <span class="admin-label" id="adminLabel">ADMIN</span>

        <button class="btn btn-light" id="loginButton" onclick="openLogin()">
            Войти
        </button>

        <button class="btn btn-light" id="logoutButton" onclick="logout()" style="display:none;">
            Выйти
        </button>
    </div>
</header>

<main class="container">

    <section class="hero">
        <h1>My Demon List</h1>
        <p>Personal Geometry Dash Demon List</p>
    </section>

    <div class="top-actions">
        <button
            class="btn btn-primary add-button"
            id="addButton"
            onclick="openAddModal()"
            style="display:none;"
        >
            + Добавить уровень
        </button>
    </div>

    <section id="levels" class="levels">
        <div class="loading">Загрузка уровней...</div>
    </section>

</main>


<!-- LOGIN MODAL -->
<div class="modal-bg" id="loginModal">
    <div class="modal">

        <h2>Вход администратора</h2>

        <div class="login-info">
            Войдите, чтобы добавлять, редактировать и удалять уровни.
        </div>

        <div class="field">
            <label>Email</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                autocomplete="email"
            >
        </div>

        <div class="field">
            <label>Пароль</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Пароль"
                autocomplete="current-password"
            >
        </div>

        <div class="modal-actions">
            <button class="btn btn-light" onclick="closeLogin()">
                Отмена
            </button>

            <button class="btn btn-primary" onclick="login()">
                Войти
            </button>
        </div>

    </div>
</div>


<!-- LEVEL MODAL -->
<div class="modal-bg" id="levelModal">
    <div class="modal">

        <h2 id="levelModalTitle">Добавить уровень</h2>

        <input type="hidden" id="editId">

        <div class="field">
            <label>Название уровня</label>
            <input
                type="text"
                id="levelName"
                placeholder="Например: -Sirius-"
            >
        </div>

        <div class="field">
            <label>Автор</label>
            <input
                type="text"
                id="levelAuthor"
                placeholder="Автор уровня"
            >
        </div>

        <div class="field">
            <label>Rank</label>
            <input
                type="number"
                id="levelRank"
                placeholder="1"
                min="1"
            >
        </div>

        <div class="field">
            <label>Score / Attempts</label>
            <input
                type="text"
                id="levelScore"
                placeholder="Например: 700,000 attempts"
            >
        </div>

        <div class="field">

            <label>Обложка уровня</label>

            <div class="upload-box">

                <input
                    type="file"
                    id="coverFile"
                    accept="image/png,image/jpeg,image/webp"
                    onchange="previewCover(event)"
                >

                <div class="upload-status" id="uploadStatus">
                    Выбери изображение с устройства
                </div>

                <div class="preview" id="coverPreview">
                    <img id="previewImage" src="" alt="Preview">
                </div>

            </div>

        </div>

        <div class="modal-actions">

            <button class="btn btn-light" onclick="closeLevelModal()">
                Отмена
            </button>

            <button class="btn btn-primary" id="saveButton" onclick="saveLevel()">
                Сохранить
            </button>

        </div>

    </div>
</div>


<div class="toast" id="toast"></div>


<script>
/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://jlqddwufeosdszoemdom.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_SlsvVAcxBAbsFVPy8V_xow_0rteDQZa";

const ADMIN_EMAIL =
    "arsenijkrasnov882@gmail.com";

const BUCKET_NAME =
    "covers";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   STATE
========================================= */

let currentUser = null;

let selectedCoverFile = null;

let selectedCoverUrl = "";

let levelsCache = [];


/* =========================================
   INITIALIZATION
========================================= */

document.addEventListener("DOMContentLoaded", async () => {

    await updateAuthUI();

    await loadLevels();

});


/* =========================================
   AUTH
========================================= */

async function updateAuthUI() {

    const {
        data: { user }
    } = await supabaseClient.auth.getUser();

    currentUser = user;

    const loginButton =
        document.getElementById("loginButton");

    const logoutButton =
        document.getElementById("logoutButton");

    const addButton =
        document.getElementById("addButton");

    const adminLabel =
        document.getElementById("adminLabel");

    if (
        currentUser &&
        currentUser.email &&
        currentUser.email.toLowerCase() ===
        ADMIN_EMAIL.toLowerCase()
    ) {

        document.body.classList.add("admin-mode");

        loginButton.style.display = "none";
        logoutButton.style.display = "block";
        addButton.style.display = "block";
        adminLabel.style.display = "block";

    } else {

        document.body.classList.remove("admin-mode");

        loginButton.style.display = "block";
        logoutButton.style.display = "none";
        addButton.style.display = "none";
        adminLabel.style.display = "none";

    }

}


async function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    if (!email || !password) {

        showToast("Введите email и пароль.");

        return;
    }

    const {
        error
    } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if (error) {

        showToast(
            "Ошибка входа: " + error.message
        );

        return;
    }

    closeLogin();

    await updateAuthUI();

    showToast("Вы вошли как администратор.");

}


async function logout() {

    await supabaseClient.auth.signOut();

    await updateAuthUI();

    showToast("Вы вышли из аккаунта.");

    await loadLevels();

}


supabaseClient.auth.onAuthStateChange(
    async () => {

        await updateAuthUI();

    }
);


/* =========================================
   LOAD LEVELS
========================================= */

async function loadLevels() {

    const levelsContainer =
        document.getElementById("levels");

    levelsContainer.innerHTML =
        '<div class="loading">Загрузка уровней...</div>';

    const {
        data,
        error
    } = await supabaseClient
        .from("levels")
        .select("*")
        .order("rank", {
            ascending: true
        });

    if (error) {

        console.error(error);

        levelsContainer.innerHTML = `
            <div class="empty">
                Не удалось загрузить уровни.<br><br>
                <small>${escapeHtml(error.message)}</small>
            </div>
        `;

        return;
    }

    levelsCache = data || [];

    /*
       Если таблица пустая, показываем
       стартовые уровни визуально.
       Они НЕ записываются в базу автоматически.
    */

    if (levelsCache.length === 0) {

        levelsCache = [
            {
                id: "default-1",
                name: "-Sirius-",
                author: "Unknown",
                rank: 1,
                score: "",
                cover_url: ""
            },
            {
                id: "default-2",
                name: "revolver",
                author: "Unknown",
                rank: 2,
                score: "",
                cover_url: ""
            },
            {
                id: "default-3",
                name: "boobawamba",
                author: "Unknown",
                rank: 3,
                score: "",
                cover_url: ""
            }
        ];

    }

    renderLevels();

}


/* =========================================
   RENDER
========================================= */

function renderLevels() {

    const container =
        document.getElementById("levels");

    if (!levelsCache.length) {

        container.innerHTML = `
            <div class="empty">
                Пока нет уровней.
            </div>
        `;

        return;
    }

    container.innerHTML =
        levelsCache.map(level => {

            const cover =
                level.cover_url
                    ? `
                        <img
                            src="${escapeAttribute(level.cover_url)}"
                            alt="Cover"
                        >
                      `
                    : escapeHtml(level.rank);

            return `
                <article class="level">

                    <div class="rank">
                        ${cover}
                    </div>

                    <div class="level-info">

                        <div class="level-name">
                            ${escapeHtml(level.name || "Unnamed")}
                        </div>

                        <div class="level-author">
                            by ${escapeHtml(level.author || "Unknown")}
                        </div>

                        ${
                            level.score
                                ? `
                                    <div class="level-score">
                                        ${escapeHtml(level.score)}
                                    </div>
                                  `
                                : ""
                        }

                    </div>

                    <div class="level-actions">

                        <button
                            class="btn btn-light"
                            onclick="openEditModal('${escapeAttribute(level.id)}')"
                        >
                            Изменить
                        </button>

                        <button
                            class="btn btn-danger"
                            onclick="deleteLevel('${escapeAttribute(level.id)}')"
                        >
                            Удалить
                        </button>

                    </div>

                </article>
            `;

        }).join("");

}


/* =========================================
   ADD LEVEL
========================================= */

function openAddModal() {

    document.getElementById("levelModalTitle").textContent =
        "Добавить уровень";

    document.getElementById("editId").value = "";

    document.getElementById("levelName").value = "";

    document.getElementById("levelAuthor").value = "";

    document.getElementById("levelRank").value =
        getNextRank();

    document.getElementById("levelScore").value = "";

    selectedCoverFile = null;

    selectedCoverUrl = "";

    resetCoverInput();

    document.getElementById("levelModal")
        .classList.add("show");

}


/* =========================================
   EDIT LEVEL
========================================= */

function openEditModal(id) {

    const level =
        levelsCache.find(
            item => String(item.id) === String(id)
        );

    if (!level) {

        showToast("Уровень не найден.");

        return;
    }

    document.getElementById("levelModalTitle").textContent =
        "Редактировать уровень";

    document.getElementById("editId").value =
        level.id;

    document.getElementById("levelName").value =
        level.name || "";

    document.getElementById("levelAuthor").value =
        level.author || "";

    document.getElementById("levelRank").value =
        level.rank || "";

    document.getElementById("levelScore").value =
        level.score || "";

    selectedCoverFile = null;

    selectedCoverUrl =
        level.cover_url || "";

    resetCoverInput();

    if (selectedCoverUrl) {

        document.getElementById("previewImage").src =
            selectedCoverUrl;

        document.getElementById("coverPreview")
            .style.display = "block";

        document.getElementById("uploadStatus").textContent =
            "Текущая обложка. Можно выбрать новую.";

    }

    document.getElementById("levelModal")
        .classList.add("show");

}


/* =========================================
   COVER PREVIEW
========================================= */

function previewCover(event) {

    const file =
        event.target.files[0];

    if (!file) {

        selectedCoverFile = null;

        return;
    }

    if (!file.type.startsWith("image/")) {

        showToast("Можно загружать только изображения.");

        event.target.value = "";

        return;
    }

    /*
       Ограничение 10 MB
    */

    if (file.size > 10 * 1024 * 1024) {

        showToast("Обложка должна быть меньше 10 MB.");

        event.target.value = "";

        return;
    }

    selectedCoverFile = file;

    const reader =
        new FileReader();

    reader.onload = function(e) {

        document.getElementById("previewImage").src =
            e.target.result;

        document.getElementById("coverPreview")
            .style.display = "block";

    };

    reader.readAsDataURL(file);

    document.getElementById("uploadStatus").textContent =
        file.name;

}


/* =========================================
   UPLOAD COVER
========================================= */

async function uploadCover() {

    if (!selectedCoverFile) {

        return selectedCoverUrl;
    }

    const status =
        document.getElementById("uploadStatus");

    status.textContent =
        "Загрузка обложки...";

    status.className =
        "upload-status";

    /*
       Уникальное имя файла
    */

    const extension =
        selectedCoverFile.name
            .split(".")
            .pop()
            .toLowerCase();

    const randomName =
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 10);

    const filePath =
        "covers/" +
        randomName +
        "." +
        extension;

    const {
        error: uploadError
    } = await supabaseClient
        .storage
        .from(BUCKET_NAME)
        .upload(
            filePath,
            selectedCoverFile,
            {
                cacheControl: "3600",
                upsert: false
            }
        );

    if (uploadError) {

        console.error(uploadError);

        status.textContent =
            "Ошибка загрузки.";

        status.className =
            "upload-status error";

        throw uploadError;
    }

    const {
        data
    } = supabaseClient
        .storage
        .from(BUCKET_NAME)
        .getPublicUrl(filePath);

    selectedCoverUrl =
        data.publicUrl;

    status.textContent =
        "Обложка загружена.";

    status.className =
        "upload-status success";

    return selectedCoverUrl;

}


/* =========================================
   SAVE LEVEL
========================================= */

async function saveLevel() {

    /*
       Проверяем администратора
    */

    if (
        !currentUser ||
        currentUser.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ) {

        showToast("Нет доступа.");

        return;
    }

    const saveButton =
        document.getElementById("saveButton");

    const id =
        document.getElementById("editId").value;

    const name =
        document.getElementById("levelName")
            .value.trim();

    const author =
        document.getElementById("levelAuthor")
            .value.trim();

    const rankValue =
        document.getElementById("levelRank")
            .value;

    const score =
        document.getElementById("levelScore")
            .value.trim();

    const rank =
        Number(rankValue);

    if (!name) {

        showToast("Введите название уровня.");

        return;
    }

    if (!author) {

        showToast("Введите автора.");

        return;
    }

    if (!rank || rank < 1) {

        showToast("Введите корректный rank.");

        return;
    }

    saveButton.disabled = true;

    saveButton.textContent =
        "Сохранение...";

    try {

        /*
           Если выбрана новая картинка -
           загружаем её.
        */

        const coverUrl =
            await uploadCover();

        const levelData = {

            name: name,

            author: author,

            rank: rank,

            score: score,

            cover_url: coverUrl || null

        };


        /* =================================
           UPDATE
        ================================= */

        if (id) {

            /*
               Если новую обложку не выбрали,
               оставляем старую.
            */

            if (!selectedCoverFile) {

                const oldLevel =
                    levelsCache.find(
                        item =>
                            String(item.id) === String(id)
                    );

                levelData.cover_url =
                    oldLevel?.cover_url || null;

            }

            const {
                error
            } = await supabaseClient
                .from("levels")
                .update(levelData)
                .eq("id", id);

            if (error) {

                throw error;
            }

            showToast("Уровень обновлён.");

        }


        /* =================================
           INSERT
        ================================= */

        else {

            const {
                error
            } = await supabaseClient
                .from("levels")
                .insert(levelData);

            if (error) {

                throw error;
            }

            showToast("Уровень добавлен.");

        }

        closeLevelModal();

        await loadLevels();

    } catch (error) {

        console.error(error);

        showToast(
            "Ошибка: " +
            error.message
        );

    } finally {

        saveButton.disabled = false;

        saveButton.textContent =
            "Сохранить";

    }

}


/* =========================================
   DELETE
========================================= */

async function deleteLevel(id) {

    if (
        !currentUser ||
        currentUser.email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
    ) {

        showToast("Нет доступа.");

        return;
    }

    const level =
        levelsCache.find(
            item => String(item.id) === String(id)
        );

    if (!level) {

        return;
    }

    const confirmed =
        confirm(
            `Удалить уровень "${level.name}"?`
        );

    if (!confirmed) {

        return;
    }

    const {
        error
    } = await supabaseClient
        .from("levels")
        .delete()
        .eq("id", id);

    if (error) {

        console.error(error);

        showToast(
            "Ошибка удаления: " +
            error.message
        );

        return;
    }

    showToast("Уровень удалён.");

    await loadLevels();

}


/* =========================================
   MODALS
========================================= */

function openLogin() {

    document.getElementById("loginModal")
        .classList.add("show");

}


function closeLogin() {

    document.getElementById("loginModal")
        .classList.remove("show");

}


function closeLevelModal() {

    document.getElementById("levelModal")
        .classList.remove("show");

}


function resetCoverInput() {

    const fileInput =
        document.getElementById("coverFile");

    fileInput.value = "";

    document.getElementById("coverPreview")
        .style.display = "none";

    document.getElementById("previewImage").src = "";

    document.getElementById("uploadStatus").textContent =
        "Выбери изображение с устройства";

    document.getElementById("uploadStatus").className =
        "upload-status";

}


/* =========================================
   NEXT RANK
========================================= */

function getNextRank() {

    const realLevels =
        levelsCache.filter(
            level =>
                typeof level.rank === "number"
        );

    if (!realLevels.length) {

        return 1;
    }

    return Math.max(
        ...realLevels.map(
            level => Number(level.rank) || 0
        )
    ) + 1;

}


/* =========================================
   TOAST
========================================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 3000);

}


/* =========================================
   SECURITY / HTML ESCAPING
========================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(value) {

    return escapeHtml(value);

}


/* =========================================
   CLOSE MODALS WHEN CLICKING BACKGROUND
========================================= */

document.querySelectorAll(".modal-bg")
    .forEach(modal => {

        modal.addEventListener("click", event => {

            if (event.target === modal) {

                modal.classList.remove("show");

            }

        });

    });


/* =========================================
   ESC KEY
========================================= */

document.addEventListener("keydown", event => {

    if (event.key === "Escape") {

        closeLogin();

        closeLevelModal();

    }

});

</script>
