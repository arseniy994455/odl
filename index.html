<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Demon List</title>

<style>
:root{
  --blue:#18aee8;
  --blue2:#087cc2;
  --text:#12324a;
  --muted:#6a8799;
  --border:#d9f2fc;
  --shadow:0 10px 30px rgba(8,124,194,.14);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#e9faff,#fff);
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}

.nav{
  max-width:1100px;
  margin:auto;
  padding:16px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:900;
  color:var(--blue2);
}

button{
  border:0;
  border-radius:12px;
  padding:11px 17px;
  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:var(--blue);
  color:white;
}

.secondary{
  background:#e8f7fd;
  color:var(--blue2);
}

.hero{
  max-width:1100px;
  margin:45px auto 25px;
  padding:0 22px;
}

.hero h1{
  font-size:clamp(36px,6vw,68px);
  line-height:1;
  margin:0 0 10px;
}

.hero p{
  color:var(--muted);
  font-size:18px;
}

.top{
  max-width:1100px;
  margin:30px auto;
  padding:0 22px;
}

.grid{
  display:grid;
  gap:18px;
}

.card{
  display:grid;
  grid-template-columns:80px 190px 1fr auto;
  align-items:center;
  gap:20px;
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:14px;
  box-shadow:var(--shadow);
}

.rank{
  font-size:32px;
  font-weight:900;
  text-align:center;
  color:var(--blue2);
}

.cover{
  width:190px;
  height:108px;
  object-fit:cover;
  border-radius:14px;
  display:block;
  background:#e9faff;
}

.info h2{
  margin:6px 0;
  font-size:23px;
}

.info p{
  margin:3px 0;
  color:var(--muted);
}

.badge{
  display:inline-block;
  background:#e5f8ff;
  color:#087cc2;
  padding:5px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:900;
}

.score{
  text-align:right;
}

.score b{
  display:block;
  font-size:20px;
  color:var(--blue2);
  margin-bottom:8px;
}

.empty{
  text-align:center;
  padding:40px;
  color:var(--muted);
}

.login-section{
  max-width:500px;
  margin:50px auto;
  padding:0 22px;
}

.login-box{
  background:white;
  border:1px solid var(--border);
  border-radius:22px;
  padding:24px;
  box-shadow:var(--shadow);
}

.login-box h2{
  margin-top:0;
}

.login-fields{
  display:grid;
  gap:12px;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #cfeaf5;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:var(--blue);
}

.login-status{
  margin-top:12px;
  color:var(--muted);
  font-size:14px;
}

#moderatorPanel,
#editor{
  display:none;
}

.editor{
  max-width:1100px;
  margin:50px auto 80px;
  padding:0 22px;
}

.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:22px;
  padding:22px;
  box-shadow:var(--shadow);
}

.panel h2{
  margin-top:0;
}

.form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

label{
  font-size:13px;
  font-weight:800;
  color:#477086;
}

label input{
  margin-top:6px;
}

.full{
  grid-column:1/-1;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:16px;
}

.preview{
  display:none;
  max-width:240px;
  margin-top:15px;
  border-radius:12px;
}

footer{
  text-align:center;
  padding:30px;
  color:#7894a5;
}

@media(max-width:700px){

  .nav{
    padding:14px;
  }

  .logo{
    font-size:18px;
  }

  .card{
    grid-template-columns:55px 1fr;
  }

  .cover{
    grid-column:2;
    width:100%;
    height:160px;
  }

  .info{
    grid-column:2;
  }

  .score{
    grid-column:2;
    text-align:left;
  }

  .form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .hero{
    margin-top:30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo" id="logo">
      My Demon List
    </div>

    <button
      class="secondary"
      onclick="openLogin()">
      Войти
    </button>

  </div>
</header>


<section class="hero">

  <h1>
    Geometry Dash<br>
    <span style="color:#18aee8">
      My Demon List
    </span>
  </h1>

  <p>
    Собственный список демонов в Geometry Dash
  </p>

</section>


<section class="top">

  <div id="list" class="grid">
    <div class="empty">
      Загрузка уровней...
    </div>
  </div>

</section>


<!-- ЕДИНСТВЕННАЯ ФОРМА ВХОДА -->

<section
  class="login-section"
  id="loginSection"
  style="display:none;">

  <div class="login-box">

    <h2>🔐 Вход модератора</h2>

    <div id="loginForm">

      <div class="login-fields">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email">

        <input
          id="loginPassword"
          type="password"
          placeholder="Пароль">

        <button
          class="primary"
          onclick="login()">
          Войти
        </button>

      </div>

    </div>


    <div id="moderatorPanel">

      <b>🛠️ Вы вошли как модератор</b>

      <br><br>

      <button
        class="secondary"
        onclick="logout()">
        Выйти
      </button>

    </div>


    <div
      id="loginStatus"
      class="login-status">
    </div>

  </div>

</section>


<!-- РЕДАКТОР -->

<section
  class="editor"
  id="editor">

  <div class="panel">

    <h2>Редактор топа</h2>

    <div class="form">

      <label>
        Название сайта
        <input
          id="siteTitle"
          placeholder="">
      </label>


      <label>
        Название уровня
        <input
          id="name"
          placeholder="Например: Sirius">
      </label>


      <label>
        Автор
        <input
          id="author"
          placeholder="Автор уровня">
      </label>


      <label>
        Позиция
        <input
          id="rank"
          type="number"
          min="1"
          placeholder="1">
      </label>


      <label>
        Очки / сложность
        <input
          id="score"
          placeholder="TOP 1">
      </label>


      <label class="full">
        Обложка уровня
        <input
          id="cover"
          type="file"
          accept="image/*">
      </label>

    </div>


    <img
      id="preview"
      class="preview"
      alt="Предпросмотр">


    <div class="actions">

      <button
        class="primary"
        onclick="addLevel()">
        Добавить в топ
      </button>

      <button
        class="secondary"
        onclick="saveSiteTitle()">
        Сохранить название
      </button>

    </div>

  </div>

</section>


<footer>
  My Demon List
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://jlqddwufeosdszoemdom.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_SlsvVAcxBAbsFVPy8V_xow_0rteDQZa";

const ADMIN_EMAIL =
  "arsenijkrasnov882@gmail.com";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   СОСТОЯНИЕ
========================= */

let levels = [];

let siteTitle =
  localStorage.getItem("gdBlueSiteTitle") || "";

let isModerator = false;


/* =========================
   НАЗВАНИЕ
========================= */

function updateSiteTitle(){

  const logo =
    document.getElementById("logo");

  logo.textContent =
    siteTitle || "My Demon List";

  document.title =
    siteTitle || "My Demon List";
}


function saveSiteTitle(){

  if(!isModerator){

    alert("Только модератор может менять название.");

    return;
  }

  const value =
    document.getElementById("siteTitle")
      .value
      .trim();

  if(!value){

    alert("Напиши название сайта.");

    return;
  }

  siteTitle = value;

  localStorage.setItem(
    "gdBlueSiteTitle",
    siteTitle
  );

  updateSiteTitle();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value).replace(
    /[&<>"']/g,
    function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    }
  );

}


/* =========================
   ЗАГРУЗКА УРОВНЕЙ
========================= */

async function loadLevels(){

  const result =
    await supabaseClient
      .from("levels")
      .select("*")
      .order(
        "rank",
        {ascending:true}
      );


  if(result.error){

    console.error(
      "Ошибка загрузки:",
      result.error
    );

    document.getElementById("list").innerHTML =
      '<div class="empty">Ошибка загрузки уровней.</div>';

    return;
  }


  levels =
    (result.data || []).map(
      function(x){

        return {

          id:x.id,

          name:x.name,

          author:x.author || "",

          rank:x.rank,

          score:x.score || "",

          cover:x.cover_url || ""

        };

      }
    );


  render();

}


/* =========================
   ОТОБРАЖЕНИЕ
========================= */

function render(){

  const list =
    document.getElementById("list");

  list.innerHTML = "";


  levels.sort(
    function(a,b){

      return Number(a.rank) -
             Number(b.rank);

    }
  );


  if(!levels.length){

    list.innerHTML =
      '<div class="empty">Топ пока пуст.</div>';

    return;
  }


  levels.forEach(
    function(x,i){

      const card =
        document.createElement("article");

      card.className = "card";


      const fallback =
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(

          `<svg xmlns="http://www.w3.org/2000/svg"
          width="600"
          height="340">

          <defs>

          <linearGradient id="g">

          <stop stop-color="#79ddff"/>

          <stop offset="1"
          stop-color="#ffffff"/>

          </linearGradient>

          </defs>

          <rect
          width="100%"
          height="100%"
          fill="url(#g)"/>

          <text
          x="50%"
          y="52%"
          text-anchor="middle"
          font-family="Arial"
          font-size="44"
          font-weight="bold"
          fill="#087cc2">

          GD • ${escapeHtml(x.name)}

          </text>

          </svg>`

        );


      let deleteButton = "";


      if(isModerator){

        deleteButton = `
          <button
            class="secondary"
            onclick="removeLevel(${i})">
            Удалить
          </button>
        `;

      }


      card.innerHTML = `

        <div class="rank">
          #${x.rank}
        </div>

        <img
          class="cover"
          src="${x.cover || fallback}"
          alt="${escapeHtml(x.name)}">

        <div class="info">

          <span class="badge">
            GEOMETRY DASH
          </span>

          <h2>
            ${escapeHtml(x.name)}
          </h2>

          <p>
            ${
              x.author
              ? "Автор: " +
                escapeHtml(x.author)
              : "Автор не указан"
            }
          </p>

        </div>

        <div class="score">

          <b>
            ${escapeHtml(x.score || "—")}
          </b>

          ${deleteButton}

        </div>

      `;


      list.appendChild(card);

    }
  );

}


/* =========================
   ОТКРЫТЬ ВХОД
========================= */

function openLogin(){

  const section =
    document.getElementById(
      "loginSection"
    );

  section.style.display =
    "block";

  section.scrollIntoView({
    behavior:"smooth"
  });

}


/* =========================
   ВХОД
========================= */

async function login(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  const status =
    document.getElementById(
      "loginStatus"
    );


  if(!email || !password){

    status.textContent =
      "Введите email и пароль.";

    return;
  }


  if(
    email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ){

    status.textContent =
      "Этот аккаунт не является модератором.";

    return;
  }


  status.textContent =
    "Выполняется вход...";


  const result =
    await supabaseClient.auth
      .signInWithPassword({

        email:email,

        password:password

      });


  if(result.error){

    console.error(
      result.error
    );

    status.textContent =
      "Ошибка входа: " +
      result.error.message;

    return;
  }


  status.textContent =
    "Вход выполнен!";


  await updateModeratorUI();

}


/* =========================
   ВЫХОД
========================= */

async function logout(){

  const result =
    await supabaseClient.auth
      .signOut();


  if(result.error){

    console.error(
      result.error
    );

    return;
  }


  isModerator = false;


  document.getElementById(
    "loginEmail"
  ).value = "";

  document.getElementById(
    "loginPassword"
  ).value = "";

  document.getElementById(
    "loginStatus"
  ).textContent = "";


  await updateModeratorUI
