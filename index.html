<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Demon List</title>

<style>
:root{
  --blue:#18aee8;
  --blue2:#087cc2;
  --light:#eefaff;
  --white:#fff;
  --text:#12324a;
  --muted:#6a8799;
  --border:#d9f2fc;
  --shadow:0 10px 30px rgba(8,124,194,.14);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#e9faff,#ffffff);
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #d7f1fc;
}

.nav{
  max-width:1100px;
  margin:auto;
  padding:18px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:22px;
  font-weight:900;
  color:var(--blue2);
}

button{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:var(--blue);
  color:white;
}

.secondary{
  background:#e8f7fd;
  color:var(--blue2);
}

.hero{
  max-width:1100px;
  margin:45px auto 25px;
  padding:0 22px;
}

.hero h1{
  font-size:clamp(36px,6vw,68px);
  margin:0 0 8px;
  line-height:1;
}

.hero p{
  color:var(--muted);
  font-size:18px;
}

.top{
  max-width:1100px;
  margin:30px auto;
  padding:0 22px;
}

.grid{
  display:grid;
  gap:18px;
}

.card{
  display:grid;
  grid-template-columns:80px 190px 1fr auto;
  align-items:center;
  gap:20px;
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:14px;
  box-shadow:var(--shadow);
}

.rank{
  font-size:32px;
  font-weight:900;
  text-align:center;
  color:var(--blue2);
}

.cover{
  width:190px;
  height:108px;
  object-fit:cover;
  border-radius:14px;
  background:linear-gradient(135deg,#79ddff,#fff);
  display:block;
}

.info h2{
  margin:0 0 6px;
  font-size:23px;
}

.info p{
  margin:3px 0;
  color:var(--muted);
}

.badge{
  display:inline-block;
  background:#e5f8ff;
  color:#087cc2;
  padding:5px 9px;
  border-radius:8px;
  font-size:12px;
  font-weight:900;
}

.score{
  text-align:right;
}

.score b{
  display:block;
  font-size:20px;
  color:var(--blue2);
  margin-bottom:8px;
}

.empty{
  text-align:center;
  padding:40px;
  color:var(--muted);
}

.login-section{
  max-width:500px;
  margin:50px auto;
  padding:0 22px;
}

.login-box{
  background:white;
  border:1px solid var(--border);
  border-radius:22px;
  padding:24px;
  box-shadow:var(--shadow);
}

.login-box h2{
  margin-top:0;
}

.login-fields{
  display:grid;
  gap:12px;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #cfeaf5;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:var(--blue);
}

.login-status{
  margin-top:12px;
  color:var(--muted);
  font-size:14px;
}

#moderatorPanel{
  display:none;
}

#editor{
  display:none;
}

.editor{
  max-width:1100px;
  margin:50px auto 80px;
  padding:0 22px;
}

.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:22px;
  padding:22px;
  box-shadow:var(--shadow);
}

.panel h2{
  margin-top:0;
}

.form{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

label{
  font-size:13px;
  font-weight:800;
  color:#477086;
}

label input{
  margin-top:6px;
}

.full{
  grid-column:1/-1;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:16px;
}

.preview{
  display:none;
  max-width:240px;
  margin-top:15px;
  border-radius:12px;
}

.small{
  margin-top:12px;
  font-size:13px;
  color:var(--muted);
}

footer{
  text-align:center;
  padding:30px;
  color:#7894a5;
}

@media(max-width:700px){

  .nav{
    padding:14px;
  }

  .logo{
    font-size:18px;
  }

  .card{
    grid-template-columns:55px 1fr;
  }

  .cover{
    grid-column:2;
    width:100%;
    height:160px;
  }

  .info{
    grid-column:2;
  }

  .score{
    grid-column:2;
    text-align:left;
  }

  .form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .hero{
    margin-top:30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo" id="logo">
      My Demon List
    </div>

    <button
      class="secondary"
      onclick="document.getElementById('loginSection').scrollIntoView({behavior:'smooth'})">
      Войти
    </button>

  </div>
</header>


<section class="hero">

  <h1>
    Geometry Dash<br>
    <span style="color:#18aee8">My Demon List</span>
  </h1>

  <p>
    Собственный список демонов в Geometry Dash
  </p>

</section>


<section class="top">

  <div id="list" class="grid"></div>

</section>


<!-- ЕДИНСТВЕННЫЙ ВХОД -->

<section class="login-section" id="loginSection">

  <div class="login-box">

    <h2> Вход модератора</h2>

    <div id="loginForm">

      <div class="login-fields">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email">

        <input
          id="loginPassword
