<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geometry Dash — Own Demonlist</title>
<style>
:root{
  --blue:#18aee8; --blue2:#087cc2; --light:#eefaff; --white:#fff;
  --text:#12324a; --muted:#6a8799; --shadow:0 10px 30px rgba(8,124,194,.14);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:linear-gradient(135deg,#e9faff,#fff);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid #d7f1fc}
.nav{max-width:1100px;margin:auto;padding:18px 22px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:900;color:var(--blue2)} .logo span{color:var(--text)}
button{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}
.primary{background:var(--blue);color:white;box-shadow:0 6px 18px rgba(24,174,232,.25)}
.secondary{background:#e8f7fd;color:var(--blue2)}
.hero{max-width:1100px;margin:45px auto 25px;padding:0 22px}
.hero h1{font-size:clamp(36px,6vw,68px);margin:0 0 8px;line-height:1}
.hero p{color:var(--muted);font-size:18px}
.top{max-width:1100px;margin:30px auto;padding:0 22px}
.grid{display:grid;gap:18px}
.card{position:relative;display:grid;grid-template-columns:90px 190px 1fr auto;align-items:center;gap:20px;background:white;border:1px solid #d9f2fc;border-radius:20px;padding:14px;box-shadow:var(--shadow);overflow:hidden}
.rank{font-size:34px;font-weight:950;text-align:center;color:var(--blue2)}
.cover{width:190px;height:108px;object-fit:cover;border-radius:14px;background:linear-gradient(135deg,#7de2ff,#fff);display:block}
.info h2{margin:0 0 6px;font-size:23px}.info p{margin:3px 0;color:var(--muted)}
.badge{display:inline-block;background:#e5f8ff;color:#087cc2;padding:5px 9px;border-radius:8px;font-size:12px;font-weight:900}
.score{text-align:right}.score b{display:block;font-size:20px;color:var(--blue2)}
.empty{text-align:center;padding:40px;color:var(--muted)}
.editor{max-width:1100px;margin:55px auto 80px;padding:0 22px}
.panel{background:#fff;border:1px solid #d9f2fc;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.panel h2{margin-top:0}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
label{font-size:13px;font-weight:800;color:#477086}input{width:100%;margin-top:6px;padding:12px;border:1px solid #cfeaf5;border-radius:10px;outline:none;font-size:15px}input:focus{border-color:var(--blue)}
.full{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.preview{margin-top:15px;display:none;max-width:240px;border-radius:12px}
.small{font-size:13px;color:var(--muted);margin-top:8px}
footer{text-align:center;color:#7894a5;padding:30px}
@media(max-width:700px){
 .card{grid-template-columns:55px 1fr;}.cover{width:100%;height:140px;grid-column:2}.info{grid-column:2}.score{grid-column:2;text-align:left}
 .form{grid-template-columns:1fr}.hero{margin-top:30px}
}
</style>
</head>
<body>
<header>
  <div class="nav">
    <div class="logo">GD <span>My demon list</span></div>
    <button class="primary" onclick="document.getElementById('editor').scrollIntoView({behavior:'smooth'})">＋ Добавить уровень</button>
  </div>
</header>

<section class="hero">
  <h1>Geometry Dash<br><span style="color:#18aee8">My demon list</span></h1>
  <p>собственный список демонов в Geometry dash</p>
</section>

<section class="top">
  <div id="list" class="grid"></div>
</section>

<section class="editor" id="editor">
  <div class="panel">
    <h2>Редактор топа</h2>
    <div class="form">
      <label>Название сайта
        <input id="siteTitle" placeholder="GD OWN DEMONThe writer uses descriptive language to show how extremely hot and still the weather is. The metaphor “as if from some enormous furnace” compares the air to heat coming from a huge furnace, making the temperature seem almost unbearable. The writer also uses personification in “the heated air grew quite easily hotter”, suggesting that the heat is constantly increasing.

The phrase “stinging feet” shows how hot the ground is, while the verbs “hid” and “panted” describe how the lizards are struggling with the heat. The exaggeration “you could have heard the least buzz a mile off” emphasises how unusually quiet and still everything has become. The short sentence “The children ceased even to think” shows that the heat is so intense that it affects the children physically and mentally.

Overall, the writer uses metaphors, personification, exaggeration and strong verbs to make the weather seem unbearably hot, oppressive and completely still.LIST">
      </label>
      <label>Название уровня
        <input id="name" placeholder="Например: Sirius">
      </label>
      <label>Автор
        <input id="author" placeholder="Например: Creator">
      </label>
      <label>Позиция
        <input id="rank" type="number" min="1" placeholder="1">
      </label>
      <label>Очки / сложность
        <input id="score" placeholder="Например: 1000 очков">
      </label>
      <label class="full">Обложка уровня
        <input id="cover" type="file" accept="image/*">
      </label>
    </div>
    <img id="preview" class="preview" alt="Предпросмотр">
    <div class="actions">
      <button class="primary" onclick="addLevel()">Добавить в топ</button>
      <button class="secondary" onclick="saveSiteTitle()">Сохранить название сайта</button>
      <button class="secondary" onclick="resetTop()">Сбросить к исходному топу</button>
    </div>
    <div class="small">После добавления в топ уровень сохраняется у всех</div>
  </div>
</section>

<footer>My demon list • личный рейтинг уровней</footer>

<script>
const defaultLevels=[
 {name:"-Sirius-",author:"",rank:1,score:"TOP 1",cover:""},
 {name:"revolver",author:"",rank:2,score:"TOP 2",cover:""},
 {name:"boobawamba",author:"",rank:3,score:"TOP 3",cover:""}
];

let levels=JSON.parse(localStorage.getItem("gdBlueTop")||"null")||defaultLevels;
let siteTitle=localStorage.getItem("gdBlueSiteTitle")||"My demon listТвой собственный топ уровней. Добавляй уровни, авторов, очки и обложки.There was an error committing your changes: A file with the same name already exists. Please choose a different name and try again.There was an error committing your changes: A file with the same name already exists. Please choose a different name and try again.";

function updateSiteTitle(){
 document.querySelector(".logo").innerHTML=escapeHtml(siteTitle);
 document.title=siteTitle;
}
function saveSiteTitle(){
 const value=document.getElementById("siteTitle").value.trim();
 if(!value){alert("Напиши название сайта.");return}
 siteTitle=value;
 localStorage.setItem("gdBlueSiteTitle",siteTitle);
 updateSiteTitle();
}
function save(){localStorage.setItem("gdBlueTop",JSON.stringify(levels));render()}
async function loadLevels(){
  const { data, error } = await supabaseClient
    .from("levels")
    .select("*")
    .order("Rank", { ascending: true });

  if(error){
    console.error("Ошибка загрузки уровней:", error);
    return;
  }

  if(data && data.length){
levels = data.map(x => ({
      id: x.id,
      name: x.name,
      author: x.Author || "",
      rank: x.Rank,
      score: x.score || "",
      cover: x.Cover_url || ""
    }));
  }

  render();
}
function render(){
 const list=document.getElementById("list");
 levels.sort((a,b)=>Number(a.rank)-Number(b.rank));
 list.innerHTML="";
 if(!levels.length){list.innerHTML='<div class="empty">Топ пока пуст. Добавь первый уровень ниже.</div>';return}
 levels.forEach((x,i)=>{
   const card=document.createElement("article"); card.className="card";
   const fallback=`data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340"><defs><linearGradient id="g"><stop stop-color="#79ddff"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="50%" y="52%" text-anchor="middle" font-family="Arial" font-size="44" font-weight="bold" fill="#087cc2">GD • ${x.name}</text></svg>`)}`;
   card.innerHTML=`
     <div class="rank">#${x.rank}</div>
     <img class="cover" src="${x.cover||fallback}" alt="${escapeHtml(x.name)}">
     <div class="info">
       <span class="badge">GEOMETRY DASH</span>
       <h2>${escapeHtml(x.name)}</h2>
       <p>${x.author?`Автор: ${escapeHtml(x.author)}`:"Автор не указан"}</p>
     </div>
     <div class="score"><b>${escapeHtml(x.score||"—")}</b><button class="secondary" onclick="removeLevel(${i})">Удалить</button></div>`;
   list.appendChild(card);
 });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function addLevel(){
  const name = document.getElementById("name").value.trim();

  if(!name){
    alert("Напиши название уровня.");
    return;
  }

  const author = document.getElementById("author").value.trim();
  const rank = Number(document.getElementById("rank").value) || levels.length + 1;
  const score = document.getElementById("score").value.trim();
  const file = document.getElementById("cover").files[0];

  let coverUrl = "";

  // Загружаем обложку в Supabase Storage
  if(file){
    const fileName = Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    const { error: uploadError } = await supabaseClient
      .storage
      .from("covers")
      .upload(fileName, file);

    if(uploadError){
      console.error(uploadError);
      alert("Ошибка загрузки обложки: " + uploadError.message);
      return;
    }

    const { data: urlData } = supabaseClient
      .storage
      .from("covers")
      .getPublicUrl(fileName);

    coverUrl = urlData.publicUrl;
  }

  // Сохраняем уровень в таблицу levels
  const { data, error } = await supabaseClient
    .from("levels")
    .insert([{
      name: name,
      Author: author,
      Rank: rank,
      score: score,
      Cover_url: coverUrl
    }])
    .select();

  if(error){
    console.error(error);
    alert("Ошибка сохранения уровня: " + error.message);
    return;
  }

  // Обновляем список на странице
  await loadLevels();
  clearForm();
}
function clearForm(){["name","author","rank","score"].forEach(id=>document.getElementById(id).value="");document.getElementById("cover").value="";document.getElementById("preview").style.display="none"}
async function removeLevel(i){
  if(!confirm("Удалить этот уровень из топа?")) return;

  const level = levels[i];

  if(!level || !level.id){
    alert("Не удалось найти ID уровня.");
    return;
  }

  const { error } = await supabaseClient
    .from("levels")
    .delete()
    .eq("id", level.id);

  if(error){
    console.error(error);
    alert("Ошибка удаления: " + error.message);
    return;
  }

  await loadLevels();
}
function resetTop(){if(confirm("Вернуть Sirius, revolver и boobawamba?")){levels=JSON.parse(JSON.stringify(defaultLevels));save()}}
document.getElementById("cover").addEventListener("change",e=>{
 const file=e.target.files[0],p=document.getElementById("preview");
 if(file){const r=new FileReader();r.onload=()=>{p.src=r.result;p.style.display="block"};r.readAsDataURL(file)}
});
document.getElementById("siteTitle").value=siteTitle;
updateSiteTitle();
loadLevels();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPABASE_KEY =
 "sb_publishable_SlsvVAcxBAbsFVPy8V_xow_0rteDQZa";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
</script>
</body>
</html>
