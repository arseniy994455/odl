<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Demon List</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --blue: #18aee8;
    --blue2: #087cc2;
    --light: #eefaff;
    --white: #ffffff;
    --text: #12324a;
    --muted: #6a8799;
    --border: #d9f2fc;
    --danger: #ef5350;
    --shadow: 0 10px 30px rgba(8,124,194,0.12);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #eefaff 0%, #ffffff 55%);
    color: var(--text);
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.header {
    height: 72px;
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(10px);
}

.logo {
    font-size: 24px;
    font-weight: 800;
    color: var(--blue2);
}

.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.admin-label {
    display: none;
    color: var(--blue2);
    font-size: 13px;
    font-weight: 700;
}

.container {
    width: min(1100px, 92%);
    margin: auto;
}

.hero {
    text-align: center;
    padding: 55px 15px 35px;
}

.hero h1 {
    margin: 0;
    font-size: clamp(36px, 7vw, 64px);
    font-weight: 900;
    color: var(--blue2);
}

.hero p {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 16px;
}

.top-actions {
    display: flex;
    justify-content: center;
    margin-bottom: 25px;
}

.levels {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 60px;
}

.level {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 18px;
    min-height: 100px;
    display: grid;
    grid-template-columns: 95px 1fr auto;
    align-items: center;
    gap: 18px;
    padding: 12px 20px 12px 12px;
    box-shadow: var(--shadow);
    transition: 0.2s ease;
}

.level:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 35px rgba(8,124,194,0.16);
}

.rank {
    width: 80px;
    height: 76px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--blue), var(--blue2));
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    font-weight: 900;
    overflow: hidden;
}

.rank img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.level-info {
    min-width: 0;
}

.level-name {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    word-break: break-word;
}

.level-author {
    margin-top: 5px;
    color: var(--muted);
    font-size: 14px;
}

.level-score {
    margin-top: 7px;
    color: var(--blue2);
    font-size: 14px;
    font-weight: 700;
}

.level-actions {
    display: none;
    gap: 7px;
}

.admin-mode .level-actions {
    display: flex;
}

.btn {
    border: none;
    border-radius: 11px;
    padding: 10px 15px;
    font-weight: 700;
    transition: 0.15s ease;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn-primary {
    background: linear-gradient(135deg, var(--blue), var(--blue2));
    color: white;
}

.btn-light {
    background: var(--light);
    color: var(--blue2);
    border: 1px solid var(--border);
}

.btn-danger {
    background: #fff0f0;
    color: var(--danger);
    border: 1px solid #ffd2d2;
}

.add-button {
    padding: 13px 22px;
    border-radius: 13px;
    font-size: 15px;
}

.empty {
    background: white;
    border: 1px dashed var(--border);
    border-radius: 18px;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
}

.loading {
    text-align: center;
    color: var(--muted);
    padding: 40px;
}

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(7,40,60,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: min(480px, 100%);
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.2);
    max-height: 90vh;
    overflow-y: auto;
}

.modal h2 {
    margin: 0 0 20px;
    color: var(--blue2);
}

.field {
    margin-bottom: 15px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
}

.field input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 12px;
    outline: none;
    color: var(--text);
    background: #fbfeff;
}

.field input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(24,174,232,0.12);
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
}

.upload-box {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    background: #f8fdff;
}

.upload-box input {
    border: none;
    padding: 5px;
    background: transparent;
}

.preview {
    display: none;
    margin-top: 12px;
}

.preview img {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 12px;
}

.upload-status {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
}

.error {
    color: var(--danger);
}

.success {
    color: #169447;
}

.login-info {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 15px;
}

.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #12324a;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transition: 0.25s ease;
    z-index: 300;
    max-width: 90%;
    text-align: center;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

@media (max-width: 700px) {
    .header {
        padding: 0 4%;
    }

    .logo {
        font-size: 20px;
    }

    .level {
        grid-template-columns: 70px 1fr;
        gap: 12px;
        padding: 10px;
    }

    .rank {
        width: 65px;
        height: 65px;
        font-size: 21px;
    }

    .level-name {
        font-size: 18px;
    }

    .level-actions {
        grid-column: 1 / -1;
        justify-content: flex-end;
    }

    .admin-label {
        display: none !important;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">My Demon List</div>

    <div class="header-right">
        <span class="admin-label" id="adminLabel">ADMIN</span>

        <button class="btn btn-light" id="loginButton" onclick="openLogin()">
            Войти
        </button>

        <button class="btn btn-light" id="logoutButton" onclick="logout()" style="display:none;">
            Выйти
        </button>
    </div>
</header>

<main class="container">

    <section class="hero">
        <h1>My Demon List</h1>
        <p>Personal Geometry Dash Demon List</p>
    </section>

    <div class="top-actions">
        <button
            class="btn btn-primary add-button"
            id="addButton"
            onclick="openAddModal()"
            style="display:none;"
        >
            + Добавить уровень
        </button>
    </div>

    <section id="levels" class="levels">
        <div class="loading">Загрузка уровней...</div>
    </section>

</main>


<!-- LOGIN MODAL -->
<div class="modal-bg" id="loginModal">
    <div class="modal">

        <h2>Вход администратора</h2>

        <div class="login-info">
            Войдите, чтобы добавлять, редактировать и удалять уровни.
        </div>

        <div class="field">
            <label>Email</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                autocomplete="email"
            >
        </div>

        <div class="field">
            <label>Пароль</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Пароль"
                autocomplete="current-password"
            >
        </div>

        <div class="modal-actions">
            <button class="btn btn-light" onclick="closeLogin()">
                Отмена
            </button>

            <button class="btn btn-primary" onclick="login()">
                Войти
            </button>
        </div>

    </div>
</div>


<!-- LEVEL MODAL -->
<div class="modal-bg" id="levelModal">
    <div class="modal">

        <h2 id="levelModalTitle">Добавить уровень</h2>

        <input type="hidden" id="editId">

        <div class="field">
            <label>Название уровня</label>
            <input
                type="text"
                id="levelName"
                placeholder="Например: -Sirius-"
            >
        </div>

        <div class="field">
            <label>Автор</label>
            <input
                type="text"
                id="levelAuthor"
                placeholder="Автор уровня"
            >
        </div>

        <div class="field">
            <label>Rank</label>
            <input
                type="number"
                id="levelRank"
                placeholder="1"
                min="1"
            >
